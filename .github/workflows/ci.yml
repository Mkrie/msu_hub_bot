name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.12.15
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check msu_hub_bot tests tools deploy
      - run: uv run --no-sync pytest -q

  security:
    name: Secrets and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/install_ci_tools.py "$RUNNER_TEMP/tools"
      - run: python3 tools/check_secrets.py
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/tools/gitleaks
      - run: '"$RUNNER_TEMP/tools/actionlint" -color'

  image:
    name: Linux image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 -t msu-hub-bot:check .
      - name: Check native libraries and startup offline
        run: docker run --rm --network none --read-only --tmpfs /tmp:mode=1777 --tmpfs /work:mode=1777 --entrypoint python -i msu-hub-bot:check - < tools/image_smoke.py
